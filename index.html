<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17353a">
  <title>同频 · 展厅相遇</title>
  <style>
    :root{color-scheme:light;--ink:#17353a;--muted:#5d7071;--paper:#f7f4ed;--deep:#eae5da;--line:#d7d2c8;--coral:#ee927d;--yellow:#f2cb63;--blue:#9fc4c5;--white:#fffdf8;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 10% 10%,#f5eacb 0,transparent 25rem),radial-gradient(circle at 90% 75%,#d7e7e3 0,transparent 28rem),#e9e5dc}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #518088;outline-offset:3px}.page{width:min(100%,540px);min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 24px 70px #18323620;position:relative;overflow:hidden}.topbar{height:72px;padding:0 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17353a18}.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.1em;font-weight:700}.brand-mark{width:31px;height:31px;border-radius:11px 11px 11px 3px;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-size:16px;transform:rotate(-4deg)}.top-actions{display:flex;align-items:center;gap:9px}.source-pill{font-size:10px;color:var(--muted);white-space:nowrap}.research-btn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:10px;padding:8px 10px;cursor:pointer}.content{padding:22px 24px 30px}.progress-head{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:2px 0 8px}.progress-track{height:4px;background:var(--deep);border-radius:9px;overflow:hidden}.progress-value{height:100%;background:var(--coral);transition:width .3s}.step{animation:rise .3s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{margin:23px 0 8px;font-size:10px;font-weight:700;letter-spacing:.15em;color:#758485}h1,h2,p{margin-top:0}h1{font-size:clamp(36px,10vw,48px);line-height:1.07;letter-spacing:-.06em;font-weight:600;margin-bottom:13px}h2{font-size:29px;line-height:1.2;letter-spacing:-.045em;font-weight:600;margin:13px 0 11px}.lead{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:18px}.hero{height:158px;border-radius:21px;margin:20px 0 21px;position:relative;overflow:hidden;background:var(--ink);color:white;padding:18px}.hero:before{content:"";position:absolute;width:205px;height:205px;border:1px solid #ffffff55;border-radius:50%;right:-21px;top:-60px;box-shadow:0 0 0 22px #ffffff08,0 0 0 45px #ffffff08,0 0 0 68px #ffffff08}.hero:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:var(--yellow);right:95px;top:28px;box-shadow:0 0 38px #f2cb6355}.orbit{position:absolute;width:205px;height:62px;border:1px solid #ffffff75;border-radius:50%;right:18px;top:48px;transform:rotate(-24deg)}.hero-copy{position:absolute;z-index:1;left:18px;bottom:17px;font-size:11px;letter-spacing:.04em;color:#f5f2e9}.hero-copy strong{color:var(--yellow);font-weight:600}.choice-list{display:grid;gap:9px;margin:16px 0}.choice{width:100%;border:1px solid var(--line);border-radius:15px;background:#fffdf8b8;color:var(--ink);text-align:left;padding:12px 13px;cursor:pointer;display:grid;grid-template-columns:38px 1fr 16px;align-items:center;gap:10px;min-height:66px;transition:.16s}.choice:hover{transform:translateY(-1px);border-color:#8ba7a5;background:var(--white)}.choice.selected{border-color:var(--ink);background:#eaf0eb;box-shadow:inset 0 0 0 1px var(--ink)}.choice-symbol{width:37px;height:37px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:#f4e5ad}.choice:nth-child(2) .choice-symbol{background:#f4d1c6}.choice:nth-child(3) .choice-symbol{background:#d2e2df}.choice:nth-child(4) .choice-symbol{background:#e6d8ed}.choice-copy strong{display:block;font-size:13px;margin-bottom:3px}.choice-copy small{font-size:10px;color:var(--muted);line-height:1.45}.arrow{font-size:17px;color:#879493}.consent{font-size:10px;line-height:1.55;color:var(--muted);padding:11px 12px;background:#eae5daaa;border-radius:12px;display:flex;align-items:flex-start;gap:8px;margin:15px 0}.consent input{accent-color:var(--ink);margin:1px 0 0;flex:0 0 auto;width:15px;height:15px}.btn{min-height:48px;border:0;border-radius:13px;padding:0 16px;cursor:pointer;font-size:13px;font-weight:600;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn-primary{color:var(--white);background:var(--ink);width:100%}.btn-primary:hover:not(:disabled){background:#244d52}.btn-soft{color:var(--ink);background:#e8e3d8}.btn-coral{color:#3b2521;background:#f4b6a5}.button-row{display:flex;gap:9px;margin-top:13px}.button-row .btn{flex:1}.back-link{display:block;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:11px;padding:11px 0;cursor:pointer}.handoff{border-radius:16px;padding:15px;background:#e7eeea;border:1px solid #cbd8d1;margin:15px 0}.handoff b{display:block;font-size:13px;margin-bottom:5px}.handoff p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.prompt-card{border-radius:18px;background:var(--white);border:1px solid var(--line);padding:16px;margin:18px 0}.prompt-label{font-size:10px;letter-spacing:.12em;color:#728182;font-weight:700}.prompt-text{font-size:17px;line-height:1.55;font-weight:600;margin:10px 0 0}.result-card{border-radius:21px;overflow:hidden;background:var(--ink);color:var(--white);padding:21px;position:relative;margin:17px 0}.result-card:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff23;border-radius:50%;right:-60px;top:-56px;box-shadow:0 0 0 22px #ffffff08,0 0 0 45px #ffffff08}.result-kicker{font-size:9px;letter-spacing:.16em;color:#bbd0cd;position:relative;z-index:1}.result-name{color:var(--yellow);font-size:27px;letter-spacing:-.04em;font-weight:600;margin:13px 0 8px;position:relative;z-index:1}.result-copy{max-width:360px;color:#e1e8e3;font-size:12px;line-height:1.75;margin-bottom:17px;position:relative;z-index:1}.result-stats{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid #ffffff30;padding-top:13px;gap:8px;position:relative;z-index:1}.result-stat b{display:block;color:white;font-size:12px}.result-stat small{font-size:9px;color:#bbd0cd}.summary-note,.task-note{font-size:10px;color:var(--muted);line-height:1.6;margin:13px 0}.footer{border-top:1px solid #17353a18;padding:13px 24px 22px;color:#788586;display:flex;justify-content:space-between;font-size:9px}.dialog{width:min(94vw,590px);max-height:88vh;border:1px solid var(--line);border-radius:22px;padding:0;color:var(--ink);background:var(--paper);box-shadow:0 28px 90px #0004}.dialog::backdrop{background:#12242680}.dialog-head{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:20px;margin:0 0 4px}.dialog-head p{font-size:10px;color:var(--muted);margin:0}.close-btn{border:1px solid var(--line);border-radius:50%;width:33px;height:33px;background:transparent;cursor:pointer;font-size:18px;color:var(--ink)}.dialog-body{padding:16px 20px 20px;overflow-y:auto}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border-radius:12px;background:var(--white);padding:11px}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{display:block;font-size:19px;margin-top:4px}.dash-title{font-size:11px;font-weight:700;margin:19px 0 8px}.bar-row{display:grid;grid-template-columns:98px 1fr 24px;align-items:center;gap:8px;font-size:9px;margin:8px 0}.bar-track{height:7px;background:var(--deep);overflow:hidden;border-radius:99px}.bar-fill{height:100%;background:var(--blue);border-radius:inherit}.table-wrap{max-height:185px;overflow:auto;border-radius:11px;background:var(--white)}table{width:100%;border-collapse:collapse;font-size:9px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e7e3db}th{position:sticky;top:0;background:#f1eee7;color:var(--muted)}.dash-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dash-actions .btn{min-height:38px;font-size:10px;padding:0 11px}.empty{color:var(--muted);font-size:10px;background:var(--white);border-radius:11px;padding:13px;line-height:1.6}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--ink);color:white;border-radius:999px;padding:10px 15px;font-size:11px;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:370px){.content{padding-left:18px;padding-right:18px}.topbar{padding:0 16px}.source-pill{display:none}.choice{grid-template-columns:35px 1fr 14px;gap:8px;padding:11px 10px}.choice-symbol{width:34px;height:34px}.result-card{padding:17px}}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">同</span><span>同频 · 展厅相遇</span></div><div class="top-actions"><span class="source-pill" id="sourcePill"></span><button class="research-btn" id="openResearch" type="button">研究视图 ↗</button></div></header>
    <main class="content" id="content" aria-live="polite"></main>
    <footer class="footer"><span>展厅里的两人微互动</span><span>约 90 秒 · 不需要注册</span></footer>
  </div>
  <dialog class="dialog" id="researchDialog" aria-labelledby="researchTitle"><div class="dialog-head"><div><h2 id="researchTitle">研究者视图</h2><p>匿名行为记录仅保存在当前浏览器</p></div><button class="close-btn" id="closeResearch" type="button" aria-label="关闭">×</button></div><div class="dialog-body" id="dashboard"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const KEY='tongpin-gallery-pairs-v1';
      const params=new URLSearchParams(location.search);
      const source=params.get('source')||'入口 A1';
      document.getElementById('sourcePill').textContent=`扫码来源 · ${source}`;
      const content=document.getElementById('content'),dialog=document.getElementById('researchDialog'),dashboard=document.getElementById('dashboard'),toast=document.getElementById('toast');
      const habits=[
        {id:'整体',icon:'◉',title:'先看整体',sub:'先退一步，感受空间和整体氛围'},
        {id:'文字',icon:'Aa',title:'先读文字',sub:'先找说明、背景或作品名字'},
        {id:'细节',icon:'⌕',title:'先看细节',sub:'先靠近，看看局部有什么线索'},
        {id:'动线',icon:'↗',title:'先看动线',sub:'先观察人怎么走、哪里停下来'}
      ];
      let records=readRecords(),toastTimer,state=freshState();
      function readRecords(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
      function saveRecords(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch{}}
      function freshState(consent=false){return{step:0,consent,partner:'同行者',first:'',guess:'',second:'',startedAt:0,revealLogged:false,cardLogged:false,talked:false,visit:records.filter(x=>x.event==='双人接力开始').length+1}}
      function track(event,detail=''){if(!state.consent)return;records.push({visit:state.visit,time:new Date().toISOString(),event,detail:String(detail).slice(0,100)});saveRecords()}
      function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
      const progressLabels=['','第一位选择','交换手机','第二位猜测','第二位选择','交换一句话','双人卡'];
      function frame(inner,step=true){const n=Math.min(Math.max(state.step,0),6);content.innerHTML=`${step?`<div class="progress-head"><span>${progressLabels[n]}</span><span>${n}/6</span></div><div class="progress-track" role="progressbar" aria-label="互动进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${n}"><div class="progress-value" style="width:${n/6*100}%"></div></div>`:''}<section class="step">${inner}</section>`}
      function go(step){state.step=step;render()}
      function render(){if(state.step===0)renderWelcome();else if(state.step===1)renderFirst();else if(state.step===2)renderHandoff();else if(state.step===3)renderGuess();else if(state.step===4)renderSecond();else if(state.step===5)renderConversation();else renderCard()}
      function renderWelcome(){
        frame(`<p class="eyebrow">一个 90 秒的观展小实验</p><h1>把你的目光，<br>借给另一个人。</h1><p class="lead">扫码开启一场轻松的双人接力：猜猜对方会怎么逛，再发现你们相同或不同的地方。作品不用互动，人与人可以先聊起来。</p><div class="hero" aria-hidden="true"><span class="orbit"></span><span class="hero-copy">两个人 · 两种视角 · <strong>一段新对话</strong></span></div><p class="eyebrow">今天和谁一起玩？</p><div class="choice-list" role="group" aria-label="选择搭档关系"><button class="choice ${state.partner==='同行者'?'selected':''}" type="button" data-partner="同行者"><span class="choice-symbol">↔</span><span class="choice-copy"><strong>和同行的人</strong><small>朋友、家人，或一起来看展的人</small></span><span class="arrow">›</span></button><button class="choice ${state.partner==='新认识的观众'?'selected':''}" type="button" data-partner="新认识的观众"><span class="choice-symbol">✳</span><span class="choice-copy"><strong>和刚认识的观众</strong><small>先问一句“要不要玩个一分钟的小接力？”</small></span><span class="arrow">›</span></button></div><label class="consent"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>可选：同意记录匿名选择和互动步骤。记录只保存在这台设备，不上传，不收姓名或联系方式；不勾选也能完整体验。</span></label><button class="btn btn-primary" id="startBtn" type="button">开始双人接力 <span aria-hidden="true">→</span></button>`,false);
        content.querySelectorAll('[data-partner]').forEach(b=>b.addEventListener('click',()=>{state.partner=b.dataset.partner;content.querySelectorAll('[data-partner]').forEach(x=>x.classList.toggle('selected',x===b))}));
        document.getElementById('consent').addEventListener('change',e=>state.consent=e.target.checked);
        document.getElementById('startBtn').addEventListener('click',()=>{state.startedAt=Date.now();track('双人接力开始',source);track('搭档关系',state.partner);go(1)})
      }
      function options(selected,field){return `<div class="choice-list" role="group" aria-label="选择观展习惯">${habits.map(h=>`<button class="choice ${selected===h.id?'selected':''}" type="button" data-pick="${field}" data-value="${h.id}" aria-pressed="${selected===h.id}"><span class="choice-symbol" aria-hidden="true">${h.icon}</span><span class="choice-copy"><strong>${h.title}</strong><small>${h.sub}</small></span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</div>`}
      function bindPicks(field,key,buttonId,eventName){content.querySelectorAll(`[data-pick="${field}"]`).forEach(b=>b.addEventListener('click',()=>{state[key]=b.dataset.value;content.querySelectorAll(`[data-pick="${field}"]`).forEach(x=>{const yes=x===b;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes))});document.getElementById(buttonId).disabled=false}));document.getElementById(buttonId).addEventListener('click',()=>{if(!state[key])return;track(eventName,state[key]);go(state.step+1)})}
      function renderFirst(){frame(`<p class="eyebrow">第一位 · 手机持有人</p><h2>你平时走进展厅，<br>第一眼会做什么？</h2><p class="lead">选最像你的一项。另一位先别偷看，等会儿TA要猜。</p>${options(state.first,'first')}<div class="handoff"><b>选好后，把手机递给搭档</b><p>TA暂时看不到你的答案，只会先凭印象猜一猜。</p></div><button class="btn btn-primary" id="nextBtn" type="button" ${state.first?'':'disabled'}>记下我的选择 →</button>`,true);bindPicks('first','first','nextBtn','第一位的观展习惯')}
      function renderHandoff(){frame(`<p class="eyebrow">接力交棒</p><h2>现在轮到搭档了。</h2><p class="lead">把屏幕交给第二位。先不要告诉TA你的选择，让TA凭对你的了解猜一次。</p><div class="hero" aria-hidden="true"><span class="orbit"></span><span class="hero-copy">猜对、猜错，<strong>都能打开新话题</strong></span></div><button class="btn btn-primary" id="readyBtn" type="button">交给TA，开始猜 →</button><button class="back-link" id="backFirst" type="button">← 返回修改</button>`,true);document.getElementById('readyBtn').addEventListener('click',()=>go(3));document.getElementById('backFirst').addEventListener('click',()=>go(1))}
      function renderGuess(){frame(`<p class="eyebrow">第二位 · 先猜对方</p><h2>你觉得TA第一眼<br>会选哪一种？</h2><p class="lead">按你对TA的了解来猜。不要找正确答案，凭直觉就好。</p>${options(state.guess,'guess')}<button class="btn btn-primary" id="nextBtn" type="button" ${state.guess?'':'disabled'}>锁定猜测 →</button>`,true);content.querySelectorAll('[data-pick="guess"]').forEach(b=>b.addEventListener('click',()=>{state.guess=b.dataset.value;content.querySelectorAll('[data-pick="guess"]').forEach(x=>{const yes=x===b;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes))});document.getElementById('nextBtn').disabled=false}));document.getElementById('nextBtn').addEventListener('click',()=>{track('第二位猜测',state.guess);track('猜中彼此',state.guess===state.first?'是':'否');go(4)})}
      function renderSecond(){frame(`<p class="eyebrow">第二位 · 也说说自己</p><h2>那你自己的第一眼呢？</h2><p class="lead">先选你平时更常做的事。选完之后，你们会一起揭晓刚才的猜测。</p>${options(state.second,'second')}<button class="btn btn-primary" id="nextBtn" type="button" ${state.second?'':'disabled'}>揭晓两个人的答案 →</button>`,true);bindPicks('second','second','nextBtn','第二位的观展习惯')}
      function getNames(){return{first:habits.find(x=>x.id===state.first),guess:habits.find(x=>x.id===state.guess),second:habits.find(x=>x.id===state.second)}}
      function getMatch(){return state.first===state.second}
      function getConversation(){const n=getNames();if(getMatch())return `你们都先${n.first.title.slice(1)}。轮流说说：是什么让你先注意到这一类线索？听完对方的理由，再补充一个自己的。`;if(state.guess===state.first)return `你猜中了TA的第一步，但你自己的习惯是“${n.second.title}”。问问TA：是什么让你先${n.first.title.slice(1)}？再交换各自的起点。`;return `你猜TA会先“${n.guess.title}”，实际TA先“${n.first.title}”。先别急着解释对错，问问TA：这个选择是怎么发生的？`}
      function renderConversation(){const n=getNames();const matched=state.guess===state.first;const heading=getMatch()?'你们的第一眼，刚好同频。':matched?'猜中了TA，却和自己不一样。':'一次猜错，正好有了新话题。';if(!state.revealLogged){track('揭晓结果',`${state.first}/${state.guess}/${state.second}`);state.revealLogged=true}frame(`<p class="eyebrow">交换目光 · 一起揭晓</p><h2>${heading}</h2><div class="result-card"><div class="result-kicker">第一位的真实选择</div><div class="result-name">${n.first.title}</div><p class="result-copy">第二位刚才${matched?'猜对':'猜错'}了。你们各自习惯：第一位先${n.first.id}，第二位先${n.second.id}。</p><div class="result-stats"><div class="result-stat"><b>${n.guess.title}</b><small>第二位的猜测</small></div><div class="result-stat"><b>${n.second.title}</b><small>第二位自己的习惯</small></div></div></div><div class="prompt-card"><div class="prompt-label">把这句话说给对方听</div><p class="prompt-text">${getConversation()}</p></div><p class="task-note">重点不是聊作品好不好看，而是听听对方如何选择、停留和发现。</p><div class="button-row"><button class="btn btn-soft" id="skipTalk" type="button">先跳过</button><button class="btn btn-primary" id="talked" type="button">我们聊过啦 ✓</button></div>`,true);document.getElementById('talked').addEventListener('click',()=>{state.talked=true;track('双人交谈结果','完成');go(6)});document.getElementById('skipTalk').addEventListener('click',()=>{state.talked=false;track('双人交谈结果','跳过');go(6)})}
      function renderCard(){const n=getNames(),matched=state.guess===state.first,conversed=state.talked;const title=getMatch()?'同频观察搭档':matched?'懂你但不同路':'意外视角搭档';const seconds=state.startedAt?Math.max(1,Math.round((Date.now()-state.startedAt)/1000)):0;if(!state.cardLogged){track('生成双人卡',title);state.cardLogged=true}frame(`<p class="eyebrow">你们共同留下的回声</p><h2>这段相遇，<br>有了自己的名字。</h2><div class="result-card"><div class="result-kicker">本次双人观展节奏卡 · 约 ${seconds} 秒</div><div class="result-name">${title}</div><p class="result-copy">${conversed?'你们已经交换了彼此的观展起点。':'你们完成了一次彼此猜测，也留下了可以继续聊的话题。'}两个人不用看同一种东西，也可以共享一次发现。</p><div class="result-stats"><div class="result-stat"><b>${n.first.title}</b><small>第一位的起点</small></div><div class="result-stat"><b>${n.second.title}</b><small>第二位的起点</small></div></div></div><p class="summary-note">这张卡只总结刚刚这一次互动，不给任何人贴固定标签。你可以把它留作纪念，也可以邀请另一位观众再玩一轮。</p><button class="btn btn-primary" id="shareCard" type="button">分享这张双人卡 ↗</button><div class="button-row"><button class="btn btn-soft" id="again" type="button">再找一位搭档</button><button class="btn btn-soft" id="showData" type="button">研究视图</button></div>`,true);document.getElementById('shareCard').addEventListener('click',shareCard);document.getElementById('again').addEventListener('click',()=>{state=freshState(state.consent);render()});document.getElementById('showData').addEventListener('click',openDashboard)}
      async function shareCard(){const n=getNames(),text=`我们的展厅双人卡：${getMatch()?'同频观察搭档':state.guess===state.first?'懂你但不同路':'意外视角搭档'}\n第一位：${n.first.title}；第二位：${n.second.title}\n猜测：${state.guess===state.first?'猜中了':'猜错也有新话题'}。`;try{if(navigator.share)await navigator.share({title:'我们的展厅双人卡',text});else{await navigator.clipboard.writeText(text);showToast('已复制，可以发给同行的人')}}catch(e){if(e.name!=='AbortError')showToast('分享暂不可用，可以截图保存')}}
      function openDashboard(){renderDashboard();dialog.showModal()}
      function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function renderDashboard(){const starts=records.filter(x=>x.event==='双人接力开始').length,completed=records.filter(x=>x.event==='生成双人卡').length,talked=records.filter(x=>x.event==='双人交谈结果'&&x.detail==='完成').length,guesses=records.filter(x=>x.event==='猜中彼此'),correct=guesses.filter(x=>x.detail==='是').length,rate=guesses.length?Math.round(correct/guesses.length*100):0;const by=(event,detail)=>records.filter(x=>x.event===event&&x.detail===detail).length;const rows=[...records].reverse().slice(0,14);const categories=habits.map(h=>h.id);dashboard.innerHTML=`<div class="metrics"><div class="metric"><small>双人接力开始</small><strong>${starts}</strong></div><div class="metric"><small>生成双人卡</small><strong>${completed}</strong></div><div class="metric"><small>观众猜中率</small><strong>${rate}%</strong></div></div><p class="dash-title">第一位的观展起点</p>${categories.map(name=>`<div class="bar-row"><span>${escapeHtml(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(by('第一位的观展习惯',name)/Math.max(1,...categories.map(x=>by('第一位的观展习惯',x)))*100)}%"></div></div><b>${by('第一位的观展习惯',name)}</b></div>`).join('')}<p class="dash-title">双人对话</p><div class="task-note">明确选择“我们聊过啦”：${talked} 次；猜测命中：${correct}/${guesses.length} 次。用于观察观众是否愿意从独自看展转向彼此交流。</div><p class="dash-title">最近的匿名行为</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>序号</th><th>行为</th><th>选择</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.visit}</td><td>${escapeHtml(r.event)}</td><td>${escapeHtml(r.detail||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">暂无记录。勾选匿名记录授权后完成一次双人接力，行为数据会保存在当前浏览器。</div>`}<div class="dash-actions"><button class="btn btn-soft" id="exportCsv" type="button">导出 CSV</button><button class="btn btn-soft" id="clearData" type="button">清除本机记录</button></div><p class="task-note">当前原型用一台手机轮流传递，数据保存在本机。若要汇总多台访客手机的结果，正式部署时需要增加匿名数据接口。</p>`;document.getElementById('exportCsv').addEventListener('click',exportCsv);document.getElementById('clearData').addEventListener('click',()=>{if(!confirm('清除此浏览器保存的全部匿名记录？'))return;records=[];saveRecords();renderDashboard();showToast('本机记录已清除')})}
      function exportCsv(){const lines=[['接力序号','时间','行为','选择'],...records.map(r=>[r.visit,r.time,r.event,r.detail])];const csv='\ufeff'+lines.map(row=>row.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='tongpin-anonymous-pairs.csv';a.click();URL.revokeObjectURL(url);showToast('匿名数据已导出')}
      document.getElementById('openResearch').addEventListener('click',openDashboard);document.getElementById('closeResearch').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render()
    })();
  </script>
